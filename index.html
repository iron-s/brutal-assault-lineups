        // --- Application Logic ---
        const searchInput = document.getElementById('artist-search');
        const allYearsContainer = document.getElementById('all-years-container');

        function renderAllLineups() {
            allYearsContainer.innerHTML = ''; // Clear previous content
            const sortedYears = Object.keys(lineups).sort((a, b) => b - a); // Sort years descending

            for (const year of sortedYears) {
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';
                yearSection.dataset.year = year;

                const yearHeading = document.createElement('h2');
                yearHeading.textContent = year;
                yearHeading.className = 'text-3xl font-bold text-red-400 mb-4 sticky top-0 bg-gray-900 py-2 year-heading';
                yearSection.appendChild(yearHeading);

                const bandList = document.createElement('ul');
                bandList.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-2';

                const sortedBands = [...new Set(lineups[year])].sort((a, b) => a.localeCompare(b));

                for (const band of sortedBands) {
                    const bandItem = document.createElement('li');
                    bandItem.textContent = band;
                    bandItem.className = 'text-gray-300 band-item';
                    bandItem.dataset.bandName = band.toLowerCase();
                    bandList.appendChild(bandItem);
                }
                yearSection.appendChild(bandList);
                allYearsContainer.appendChild(yearSection);
            }
        }

        renderAllLineups();

        // 1. Prepare data for Fuse.js
        const allArtists = [...new Set(Object.values(lineups).flat())];

        // 2. Configure Fuse.js for fuzzy searching
        const fuseOptions = {
            includeScore: true,
            threshold: 0.4, // Adjust for more or less strictness (0.0 = perfect match, 1.0 = match anything)
        };
        const fuse = new Fuse(allArtists, fuseOptions);

        // 3. Handle search input for fuzzy filtering
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();

            if (query === '') {
                document.querySelectorAll('.year-section').forEach(section => {
                    section.classList.remove('hidden');
                    section.querySelectorAll('.band-item').forEach(item => item.classList.remove('hidden'));
                });
                return;
            }

            const results = fuse.search(query);
            const matchingArtists = new Set(results.map(result => result.item.toLowerCase()));

            document.querySelectorAll('.year-section').forEach(section => {
                let hasVisibleBands = false;
                section.querySelectorAll('.band-item').forEach(item => {
                    const bandName = item.dataset.bandName;
                    if (matchingArtists.has(bandName)) {
                        item.classList.remove('hidden');
                        hasVisibleBands = true;
                    } else {
                        item.classList.add('hidden');
                    }
                });

                if (hasVisibleBands) {
                    section.classList.remove('hidden');
                } else {
                    section.classList.add('hidden');
                }
            });
        });
